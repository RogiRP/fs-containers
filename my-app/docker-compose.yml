services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samurai-frontend
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3001
    container_name: samurai-backend
  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8081:80
    container_name: samurai-reverse-proxy
    depends_on:
      - app
      - server